<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111a2e"/><stop offset="1" stop-color="#06080f"/></linearGradient></defs><rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/><rect x="17.5" y="17.5" width="477" height="477" rx="106.5" fill="none" stroke="#1e293b" stroke-width="3"/><g transform="translate(256 256) scale(0.86) translate(-256 -262)">
