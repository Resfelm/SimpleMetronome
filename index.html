<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Precision Studio Metronome</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#06080f">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <style>
    /* Fonts are bundled with the app (fonts/ folder) so it works fully offline. */
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/inter-400.woff') format('woff'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/inter-600.woff') format('woff'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 700; font-display: swap; src: url('fonts/inter-700.woff') format('woff'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 800; font-display: swap; src: url('fonts/inter-800.woff') format('woff'); }
    @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 100 500; font-display: swap; src: url('fonts/jetbrains-mono-400.woff') format('woff'); }
    @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 600 900; font-display: swap; src: url('fonts/jetbrains-mono-700.woff') format('woff'); }

    /* ---------- Page layout ----------
       Phones: the console fills the whole screen (width and height).
       Wider screens (PC, tablet, landscape): a centered, phone-proportioned card with a capped size. */
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto; /* only kicks in on extremely short screens */
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh; /* dynamic viewport: excludes mobile browser toolbars */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        max(6px, env(safe-area-inset-top))
        max(6px, env(safe-area-inset-right))
        max(6px, env(safe-area-inset-bottom))
        max(6px, env(safe-area-inset-left));
    }

    #metronomeConsole {
      /* Everything inside scales from --u, which is 1% of the console height,
         capped by the console width so things never get too wide for the screen. */
      container-type: size;
      isolation: isolate;      /* own stacking layer, so the beat flash can sit behind the panels */
      --u: min(1cqh, 1.6cqw);
      --v: 1cqh; /* pure height unit, for button heights on tall screens */
      width: 100%;
      max-width: 30rem;
      flex: 0 0 auto;
      /* Phones: exactly the screen height minus the page padding.
         (An explicit height is needed for the container-relative sizing to work.) */
      height: calc(100vh - max(6px, env(safe-area-inset-top)) - max(6px, env(safe-area-inset-bottom)));
      height: calc(100dvh - max(6px, env(safe-area-inset-top)) - max(6px, env(safe-area-inset-bottom)));
      min-height: 480px;       /* shorter screens (e.g. phone held sideways) scroll instead of squashing */
      display: flex;
      flex-direction: column;
      gap: clamp(5px, 1.1vh, 12px);
      padding: clamp(8px, 1.4vh, 16px);
    }
    @supports not (container-type: size) {
      #metronomeConsole { --u: min(1vh, 1.6vw); --v: 1vh; }
    }
    @media (min-width: 640px) {
      body { padding: 1rem; }
      #metronomeConsole {
        height: min(calc(100vh - 2rem), 760px);
        height: min(calc(100dvh - 2rem), 760px);
      }
    }

    /* Rows share the console height in these proportions */
    .row-beats { flex: 0.7 1 0; }
    .row-bpm   { flex: 2.2 1 0; }
    .row-mid   { flex: 2.5 1 0; }
    .row-timer { flex: 2.1 1 0; }
    .row-play  { flex: 1.0 1 0; display: flex; }

    /* ---------- Scalable text ---------- */
    .lbl    { font-size: max(9px, calc(var(--u) * 1.7)); line-height: 1; }
    .lbl-xs { font-size: max(8px, calc(var(--u) * 1.4)); line-height: 1; }

    /* ---------- Row 1: beat strip ---------- */
    .row-beats { padding: 0 calc(var(--u) * 1.8); gap: var(--u); }
    .beat-side { gap: calc(var(--u) * 1); }
    .pulse-dot { width: max(8px, calc(var(--u) * 1.3)); height: max(8px, calc(var(--u) * 1.3)); }
    .meter-badge { font-size: max(11px, calc(var(--u) * 2)); padding: 0.2em 0.45em; line-height: 1.1; }
    .install-btn { padding: 0.45em 0.9em; }
    .beat-lights { gap: max(4px, calc(var(--u) * 0.8)); }
    .beat-node { width: var(--b); height: var(--b); font-size: calc(var(--b) * 0.42); }
    .beat-l { --b: max(24px, calc(var(--u) * 5.2)); }
    .beat-m { --b: max(20px, calc(var(--u) * 4.2)); }
    .beat-s { --b: max(16px, calc(var(--u) * 3.3)); }

    /* ---------- Row 2: BPM ---------- */
    .row-bpm { padding: calc(var(--u) * 1.2); gap: calc(var(--u) * 1); }
    .bpm-arrow-btn { width: clamp(2.4rem, 11.5cqw, 5rem); }
    .arrow-glyph { font-size: max(12px, calc(var(--u) * 3)); }
    .arrow-sub   { font-size: max(9px, calc(var(--u) * 1.8)); margin-top: 0.3em; }
    .bpm-number-text { font-size: max(1.8rem, calc(var(--u) * 11)); }
    .bpm-caption { font-size: max(8px, calc(var(--u) * 1.5)); margin-top: 0.5em; }
    /* Tap tempo feedback */
    .bpm-tap { cursor: pointer; }
    .bpm-tap.tactile-btn:active:not(:disabled) { transform: scale(0.985); }
    .bpm-tap.tap-hit { background-color: #1e293b; border-color: #10b981; }

    /* ---------- Row 3: time signature + volume/brightness ---------- */
    .row-mid { gap: calc(var(--u) * 1.2); }
    .card { padding: calc(var(--u) * 1.4); gap: var(--u); }
    .ts-arrow-btn { width: max(1.8rem, calc(var(--u) * 8)); height: max(1.6rem, min(calc(var(--v) * 5.5), calc(var(--u) * 9))); font-size: max(12px, calc(var(--u) * 2.6)); }
    .ts-number-text { font-size: max(1.1rem, calc(var(--u) * 7.5)); }
    .ts-divider { width: 45%; height: 2px; margin: calc(var(--v) * 1.2) 0; }
    .vol-icon { width: max(20px, calc(var(--u) * 4.5)); height: max(20px, calc(var(--u) * 4.5)); }
    .vol-svg  { width: 65%; height: 65%; }
    .slider-group { gap: calc(var(--u) * 0.6); }
    .slider-head { gap: calc(var(--u) * 1); }

    /* Range sliders (volume & brightness) */
    .range {
      --fill: #10b981;
      --pct: 50%;
      --track: max(8px, calc(var(--u) * 1.4));
      --thumb: max(22px, calc(var(--u) * 4.4));
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      height: max(30px, min(calc(var(--v) * 5.5), calc(var(--u) * 8)));
      margin: 0;
      cursor: pointer;
      touch-action: pan-y;
    }
    .range-brightness { --fill: #f59e0b; }
    .range.range-muted { --fill: #475569; }
    .range:focus { outline: none; }
    .range::-webkit-slider-runnable-track {
      height: var(--track);
      border-radius: 999px;
      border: 1px solid #334155;
      background: linear-gradient(to right, var(--fill) 0 var(--pct), #1e293b var(--pct) 100%);
    }
    .range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: var(--thumb);
      height: var(--thumb);
      margin-top: calc((var(--track) - var(--thumb)) / 2 - 1px);
      border-radius: 50%;
      background: #f8fafc;
      border: 3px solid var(--fill);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }
    .range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.5); }
    .range::-moz-range-track { height: var(--track); border-radius: 999px; border: 1px solid #334155; background: #1e293b; }
    .range::-moz-range-progress { height: var(--track); border-radius: 999px; background: var(--fill); }
    .range::-moz-range-thumb { width: var(--thumb); height: var(--thumb); border-radius: 50%; background: #f8fafc; border: 3px solid var(--fill); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); }

    /* ---------- Row 4: practice timer ---------- */
    .row-timer { padding: calc(var(--u) * 1.2) calc(var(--u) * 1.4); gap: max(5px, calc(var(--v) * 0.9)); }
    .timer-adjuster { flex: 1 1 auto; min-height: 38px; gap: calc(var(--u) * 0.7); padding: calc(var(--u) * 0.6); }
    .timer-arrow { width: clamp(2.3rem, 11cqw, 4.25rem); }
    .timer-display { font-size: max(18px, calc(var(--u) * 5.6)); }
    .timer-controls { flex: 0 0 auto; gap: calc(var(--u) * 0.8); height: max(32px, min(calc(var(--v) * 6), calc(var(--u) * 9))); }
    .timer-main-btn { font-size: max(11px, calc(var(--u) * 2.1)); }
    .timer-reset { width: max(36px, calc(var(--u) * 9)); }
    .timer-reset svg { width: max(14px, calc(var(--u) * 2.6)); height: max(14px, calc(var(--u) * 2.6)); }

    /* Beat flash on the console background only: it sits behind all the panels,
       so it shows in the gaps between them (driven by JS, strength = brightness slider) */
    .beat-flash {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0;
      z-index: -1;
    }

    /* ---------- Row 5: start / stop ---------- */
    .start-btn { font-size: max(14px, calc(var(--u) * 2.8)); gap: 0.6em; }
    .start-icon { width: 1.15em; height: 1.15em; }

    button, .tactile-btn {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.08s ease, background-color 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .tactile-btn:active:not(:disabled) {
      transform: translateY(1px) scale(0.96);
    }

    /* Active flash animation for the beat indicator */
    .beat-node {
      transition: all 0.06s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .beat-accent-active {
      background-color: #f59e0b !important; /* Amber 500 */
      border-color: #fde68a !important;
      color: #020617 !important;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.9);
      transform: scale(1.14);
    }
    .beat-regular-active {
      background-color: #10b981 !important; /* Emerald 500 */
      border-color: #a7f3d0 !important;
      color: #020617 !important;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.85);
      transform: scale(1.12);
    }

    /* Console border pulse on beat (strength follows the brightness slider) */
    .panel-flash-accent {
      box-shadow: 0 0 0 2px rgb(245 158 11 / calc(0.9 * var(--flash, 0.6))), 0 10px 25px -5px rgba(0, 0, 0, 0.6) !important;
    }
    .panel-flash-regular {
      box-shadow: 0 0 0 2px rgb(16 185 129 / calc(0.8 * var(--flash, 0.6))), 0 10px 25px -5px rgba(0, 0, 0, 0.6) !important;
    }

    /* Practice Timer completion alarm flash */
    @keyframes timerAlarmPulse {
      0%, 100% {
        background-color: rgba(245, 158, 11, 0.25);
        border-color: #f59e0b;
        box-shadow: 0 0 15px rgba(245, 158, 11, 0.65);
      }
      50% {
        background-color: rgba(244, 63, 94, 0.28);
        border-color: #f43f5e;
        box-shadow: 0 0 18px rgba(244, 63, 94, 0.75);
      }
    }
    .timer-alarm-active {
      animation: timerAlarmPulse 0.55s infinite ease-in-out;
    }
  </style>

       If you add new Tailwind classes, the file needs regenerating. -->

<body class="bg-slate-950 text-slate-100 font-sans">

  <!-- Metronome console: fills the screen on phones, a capped card on larger screens -->
  <main id="metronomeConsole" class="bg-slate-900/95 border border-slate-800 rounded-2xl shadow-xl transition-shadow duration-100 relative overflow-hidden">
    
    <!-- Top accent gradient line -->
    <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-amber-500 via-emerald-500 to-cyan-500 opacity-85"></div>

    <!-- ROW 1: Visual Beat Indicator Strip -->
    <section aria-label="Beat Indicator" class="row-beats bg-slate-950 border border-slate-800/90 rounded-xl flex items-center justify-between">
      <div class="beat-side flex items-center shrink-0">
        <div id="headerPulseDot" class="pulse-dot rounded-full bg-slate-700 transition-all duration-75"></div>
        <span id="tempoMarking" class="lbl font-bold uppercase tracking-wider text-amber-400/90">120 BPM</span>
      </div>

      <!-- Dynamic Row of Beat Lights -->
      <div id="beatLightsContainer" class="beat-lights flex flex-wrap items-center justify-center flex-1">
        <!-- Populated by JS -->
      </div>

      <div class="beat-side flex items-center shrink-0">
        <button id="install-btn" style="display: none;" class="install-btn lbl rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 font-bold uppercase tracking-wider hover:bg-emerald-500/30 active:scale-95 transition">
          Install App
        </button>
        <span id="headerMeterBadge" class="meter-badge font-mono font-bold text-emerald-400 bg-slate-900 border border-slate-800 rounded shrink-0">4/4</span>
      </div>
    </section>

    <!-- ROW 2: BPM Display & Controls: [<<] [<] [BPM Display] [>] [>>] -->
    <section aria-label="BPM Controls" class="row-bpm flex items-stretch justify-between bg-slate-950 border border-slate-800 rounded-xl shadow-inner">
      
      <!-- Double Left Arrow: -5 BPM -->
      <button
        id="bpmDec5Btn"
        type="button"
        title="Decrease BPM by 5"
        aria-label="Decrease BPM by 5"
        class="tactile-btn bpm-arrow-btn flex flex-col items-center justify-center rounded-lg bg-slate-800/90 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 text-slate-100 shadow disabled:opacity-40 disabled:cursor-not-allowed shrink-0"
      >
        <span class="arrow-glyph font-mono font-bold leading-none tracking-tighter">&lt;&lt;</span>
        <span class="arrow-sub font-semibold text-slate-400 leading-none">-5</span>
      </button>

      <!-- Single Left Arrow: -1 BPM -->
      <button
        id="bpmDec1Btn"
        type="button"
        title="Decrease BPM by 1"
        aria-label="Decrease BPM by 1"
        class="tactile-btn bpm-arrow-btn flex flex-col items-center justify-center rounded-lg bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 text-slate-100 shadow disabled:opacity-40 disabled:cursor-not-allowed shrink-0"
      >
        <span class="arrow-glyph font-mono font-bold leading-none">&lt;</span>
        <span class="arrow-sub font-semibold text-slate-400 leading-none">-1</span>
      </button>

      <!-- Center BPM Number Display — also the Tap Tempo button (tap it along with the music, or press T) -->
      <button
        id="bpmTapBtn"
        type="button"
        title="Tap repeatedly along with the music to set the tempo (keyboard: T)"
        aria-label="Tap tempo"
        class="tactile-btn bpm-tap flex-1 min-w-0 flex flex-col items-center justify-center px-1 bg-slate-900/90 border border-slate-800/80 rounded-lg"
      >
        <div
          id="bpmDisplay"
          class="bpm-number-text font-mono font-extrabold tracking-tight text-white tabular-nums leading-none"
          aria-live="polite"
        >
          120
        </div>
        <span id="bpmCaption" class="bpm-caption font-bold uppercase tracking-widest text-slate-400 leading-none">Tap for tempo</span>
      </button>

      <!-- Single Right Arrow: +1 BPM -->
      <button
        id="bpmInc1Btn"
        type="button"
        title="Increase BPM by 1"
        aria-label="Increase BPM by 1"
        class="tactile-btn bpm-arrow-btn flex flex-col items-center justify-center rounded-lg bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 text-slate-100 shadow disabled:opacity-40 disabled:cursor-not-allowed shrink-0"
      >
        <span class="arrow-glyph font-mono font-bold leading-none">&gt;</span>
        <span class="arrow-sub font-semibold text-slate-400 leading-none">+1</span>
      </button>

      <!-- Double Right Arrow: +5 BPM -->
      <button
        id="bpmInc5Btn"
        type="button"
        title="Increase BPM by 5"
        aria-label="Increase BPM by 5"
        class="tactile-btn bpm-arrow-btn flex flex-col items-center justify-center rounded-lg bg-slate-800/90 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 text-slate-100 shadow disabled:opacity-40 disabled:cursor-not-allowed shrink-0"
      >
        <span class="arrow-glyph font-mono font-bold leading-none tracking-tighter">&gt;&gt;</span>
        <span class="arrow-sub font-semibold text-slate-400 leading-none">+5</span>
      </button>

    </section>

    <!-- ROW 3: Time Signature & Volume Control Side-by-Side Grid -->
    <section class="row-mid grid grid-cols-2">
      
      <!-- Left Card: Time Signature (Top & Bottom Numbers with < and > arrows) -->
      <div class="card bg-slate-950 border border-slate-800 rounded-xl flex flex-col min-w-0">
        <div class="flex items-center justify-between gap-1">
          <span class="lbl font-bold uppercase tracking-wider text-slate-400">Time Sig</span>
          <span id="timeSigLabel" class="lbl font-mono font-bold text-amber-400">4/4</span>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center">
          <!-- Top Number Row (Beats per Measure: 1-16) -->
          <div class="flex items-center justify-between w-full gap-1">
            <button
              id="tsTopDecBtn"
              type="button"
              aria-label="Decrease top time signature number"
              class="tactile-btn ts-arrow-btn rounded-md bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 font-mono font-bold text-slate-100 flex items-center justify-center disabled:opacity-40 shrink-0"
            >
              &lt;
            </button>
            <span id="tsTopDisplay" class="ts-number-text font-mono font-extrabold text-white tabular-nums leading-none">4</span>
            <button
              id="tsTopIncBtn"
              type="button"
              aria-label="Increase top time signature number"
              class="tactile-btn ts-arrow-btn rounded-md bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 font-mono font-bold text-slate-100 flex items-center justify-center disabled:opacity-40 shrink-0"
            >
              &gt;
            </button>
          </div>

          <!-- Fraction Divider Bar -->
          <div class="ts-divider bg-slate-700 rounded-full"></div>

          <!-- Bottom Number Row (Beat Note Value: 1, 2, 4, 8, 16) -->
          <div class="flex items-center justify-between w-full gap-1">
            <button
              id="tsBottomDecBtn"
              type="button"
              aria-label="Decrease bottom time signature number"
              class="tactile-btn ts-arrow-btn rounded-md bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 font-mono font-bold text-slate-100 flex items-center justify-center disabled:opacity-40 shrink-0"
            >
              &lt;
            </button>
            <span id="tsBottomDisplay" class="ts-number-text font-mono font-extrabold text-white tabular-nums leading-none">4</span>
            <button
              id="tsBottomIncBtn"
              type="button"
              aria-label="Increase bottom time signature number"
              class="tactile-btn ts-arrow-btn rounded-md bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 font-mono font-bold text-slate-100 flex items-center justify-center disabled:opacity-40 shrink-0"
            >
              &gt;
            </button>
          </div>
        </div>
      </div>

      <!-- Right Card: Volume & Brightness sliders -->
      <div class="card bg-slate-950 border border-slate-800 rounded-xl flex flex-col justify-evenly min-w-0">

        <!-- Volume: far left = muted, far right = loudest -->
        <div class="slider-group flex flex-col">
          <div class="flex items-center justify-between gap-1">
            <div class="slider-head flex items-center min-w-0">
              <div id="volumeIconWrapper" class="vol-icon rounded bg-slate-900 border border-slate-700 flex items-center justify-center text-emerald-400 shrink-0">
                <svg id="volumeSvg" xmlns="http://www.w3.org/2000/svg" class="vol-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14" />
                </svg>
              </div>
              <label for="volumeSlider" class="lbl font-bold uppercase tracking-wider text-slate-300 truncate">Volume</label>
            </div>
            <span id="volumeValue" class="lbl font-mono font-bold text-emerald-400 tabular-nums">85%</span>
          </div>
          <input id="volumeSlider" type="range" min="0" max="100" step="1" value="85" class="range range-volume w-full" aria-label="Volume">
        </div>

        <!-- Brightness: strength of the beat flash; far left = no flash -->
        <div class="slider-group flex flex-col">
          <div class="flex items-center justify-between gap-1">
            <div class="slider-head flex items-center min-w-0">
              <div id="brightnessIconWrapper" class="vol-icon rounded bg-slate-900 border border-amber-500/40 flex items-center justify-center text-amber-400 shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="vol-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 18h6" />
                  <path d="M10 22h4" />
                  <path d="M15.1 14c.2-1 .7-1.7 1.5-2.5A5.9 5.9 0 0 0 18 7.9 6 6 0 0 0 6 8c0 1.4.5 2.6 1.4 3.5.8.8 1.3 1.5 1.5 2.5" />
                </svg>
              </div>
              <label for="brightnessSlider" class="lbl font-bold uppercase tracking-wider text-slate-300 truncate">Brightness</label>
            </div>
            <span id="brightnessValue" class="lbl font-mono font-bold text-amber-400 tabular-nums">60%</span>
          </div>
          <input id="brightnessSlider" type="range" min="0" max="100" step="1" value="60" class="range range-brightness w-full" aria-label="Beat flash brightness">
        </div>

      </div>

    </section>

    <!-- ROW 4: Practice Countdown Timer -->
    <section
      id="timerSection"
      aria-label="Practice Countdown Timer"
      class="row-timer bg-slate-950 border border-slate-800 rounded-xl flex flex-col transition-colors"
    >
      <!-- Header: label & status -->
      <div class="flex items-center justify-between gap-1">
        <div class="flex items-center gap-1.5">
          <span id="timerStatusDot" class="pulse-dot rounded-full bg-slate-700 transition-all"></span>

        </div>
        <span id="timerStateSubtext" class="lbl-xs font-mono text-slate-400 font-semibold">READY</span>

      <!-- Adjusters & readout: [-1 min] [-5 sec] [MM:SS] [+5 sec] [+1 min] -->
      <div class="timer-adjuster flex items-stretch bg-slate-900/90 border border-slate-800/90 rounded-lg">
        <button id="timerDecBtn" type="button" title="Decrease timer by 1 minute" aria-label="Decrease timer by 1 minute"

          <span class="arrow-glyph font-mono font-bold leading-none tracking-tighter">&lt;&lt;</span>
          <span class="arrow-sub font-semibold text-slate-400 leading-none">-1m</span>
        </button>
        <button id="timerDec5Btn" type="button" title="Decrease timer by 5 seconds" aria-label="Decrease timer by 5 seconds"
          class="tactile-btn timer-arrow flex flex-col items-center justify-center rounded-md bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 text-slate-100 disabled:opacity-40 disabled:cursor-not-allowed shrink-0">
          <span class="arrow-glyph font-mono font-bold leading-none">&lt;</span>
          <span class="arrow-sub font-semibold text-slate-400 leading-none">-5s</span>
        </button>

        <div
          id="timerDisplay"
          class="timer-display flex-1 min-w-0 flex items-center justify-center font-mono font-extrabold text-white tabular-nums tracking-tight select-none"
          aria-live="polite"
        >
          05:00

        <button id="timerInc5Btn" type="button" title="Increase timer by 5 seconds" aria-label="Increase timer by 5 seconds"
          class="tactile-btn timer-arrow flex flex-col items-center justify-center rounded-md bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 text-slate-100 disabled:opacity-40 disabled:cursor-not-allowed shrink-0">
          <span class="arrow-glyph font-mono font-bold leading-none">&gt;</span>
          <span class="arrow-sub font-semibold text-slate-400 leading-none">+5s</span>
        </button>
        <button id="timerIncBtn" type="button" title="Increase timer by 1 minute" aria-label="Increase timer by 1 minute"
          class="tactile-btn timer-arrow flex flex-col items-center justify-center rounded-md bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 text-slate-100 disabled:opacity-40 disabled:cursor-not-allowed shrink-0">
          <span class="arrow-glyph font-mono font-bold leading-none tracking-tighter">&gt;&gt;</span>
          <span class="arrow-sub font-semibold text-slate-400 leading-none">+1m</span>
        </button>
      </div>

      <!-- Start/Pause & Reset, below the readout -->
      <div class="timer-controls flex items-stretch">
        <button
          id="timerStartPauseBtn"
          type="button"
          class="tactile-btn timer-main-btn flex-1 rounded-lg bg-cyan-500 hover:bg-cyan-400 active:bg-cyan-600 text-slate-950 font-extrabold uppercase tracking-wider shadow-sm flex items-center justify-center gap-1 transition-all"
        >
          <span id="timerStartPauseText">Start Timer</span>
        </button>

        <button
          id="timerResetBtn"
          type="button"
          title="Reset Timer"
          aria-label="Reset Timer"
          class="tactile-btn timer-reset rounded-lg bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 text-slate-300 flex items-center justify-center shrink-0"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- ROW 5: Prominent Start / Stop Metronome Button -->
    <section aria-label="Playback Controls" class="row-play">
      <button
        id="startStopBtn"
        type="button"
        class="tactile-btn start-btn w-full px-4 rounded-xl bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-slate-950 font-extrabold tracking-wide uppercase shadow-md shadow-emerald-500/20 flex items-center justify-center transition-all"
      >
        <span id="startStopIcon" class="flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="start-icon fill-current" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </span>
        <span id="startStopText">Start Metronome</span>
      </button>
    </section>

    <!-- Beat flash layer (behind the panels) -->
    <div id="beatFlash" class="beat-flash" aria-hidden="true"></div>

  </main>

  <!-- Application Logic & Web Audio API Scheduler -->
  <script>
    (function () {
      'use strict';

      // --- State Configuration ---
      const MIN_BPM = 30;
      const MAX_BPM = 300;
      const MIN_TOP_TS = 1;
      const MAX_TOP_TS = 16;
      const NOTE_VALUES = [1, 2, 4, 8, 16];
      const MIN_TIMER_SEC = 5;
      const MAX_TIMER_SEC = 90 * 60;
      const ALARM_VISUAL_MS = 3000;   // how long the "TIME UP" flash stays before the timer resets

      // Sound shaping. The click is driven hard into a compressor + soft clipper so it is loud
      // without distorting; the volume slider is applied AFTER that, so it fades evenly to silence.
      // Max volume is ~2.8 dB louder than the old "level 5".
      const CLICK_DRIVE = 4.5;
      const CLICK_DECAY_SEC = 0.08;
      const BEEP_DRIVE = 1.0;

      // Beat flash: peak opacity of the console-background flash at 100% brightness
      const FLASH_MAX_OPACITY = 0.9;

      const state = {
        bpm: 120,
        volume: 85,            // 0 (muted) to 100 (loudest)
        brightness: 60,        // 0 (no flash) to 100 (strongest flash)
        beatsPerMeasure: 4,    // Top number of time signature
        beatUnitIndex: 2,      // Index in NOTE_VALUES (2 -> 4, i.e., quarter note)
        isPlaying: false,
        currentBeat: 0,
        nextNoteTime: 0.0,
        timerID: null,
        visualQueue: [],
        // Practice Countdown Timer State
        timerPresetSec: 5 * 60,   // the time the timer resets to
        timerRemainingSec: 5 * 60,
        timerRunning: false,
        timerPaused: false,
        timerEndTimeMs: 0,
        timerIntervalID: null,
        timerAlarmActive: false,
        alarmTimeoutID: null
      };

      let audioCtx = null;
      const LOOKAHEAD_MS = 25.0;
      const SCHEDULE_AHEAD_SEC = 0.1;

      // --- DOM Elements ---
      const metronomeConsole = document.getElementById('metronomeConsole');
      const beatFlash = document.getElementById('beatFlash');
      const headerPulseDot = document.getElementById('headerPulseDot');
      const tempoMarking = document.getElementById('tempoMarking');
      const headerMeterBadge = document.getElementById('headerMeterBadge');
      const beatLightsContainer = document.getElementById('beatLightsContainer');

      // BPM elements
      const bpmDisplay = document.getElementById('bpmDisplay');
      const bpmDec5Btn = document.getElementById('bpmDec5Btn');
      const bpmDec1Btn = document.getElementById('bpmDec1Btn');
      const bpmInc1Btn = document.getElementById('bpmInc1Btn');
      const bpmInc5Btn = document.getElementById('bpmInc5Btn');
      const bpmTapBtn = document.getElementById('bpmTapBtn');
      const bpmCaption = document.getElementById('bpmCaption');

      // Time signature elements
      const timeSigLabel = document.getElementById('timeSigLabel');
      const tsTopDisplay = document.getElementById('tsTopDisplay');
      const tsBottomDisplay = document.getElementById('tsBottomDisplay');
      const tsTopDecBtn = document.getElementById('tsTopDecBtn');
      const tsTopIncBtn = document.getElementById('tsTopIncBtn');
      const tsBottomDecBtn = document.getElementById('tsBottomDecBtn');
      const tsBottomIncBtn = document.getElementById('tsBottomIncBtn');

      // Volume & brightness elements
      const volumeSlider = document.getElementById('volumeSlider');
      const volumeValue = document.getElementById('volumeValue');
      const volumeIconWrapper = document.getElementById('volumeIconWrapper');
      const volumeSvg = document.getElementById('volumeSvg');
      const brightnessSlider = document.getElementById('brightnessSlider');
      const brightnessValue = document.getElementById('brightnessValue');
      const brightnessIconWrapper = document.getElementById('brightnessIconWrapper');

      // Practice Timer elements
      const timerSection = document.getElementById('timerSection');
      const timerStatusDot = document.getElementById('timerStatusDot');
      const timerStateSubtext = document.getElementById('timerStateSubtext');
      const timerDecBtn = document.getElementById('timerDecBtn');     // -1 min
      const timerDec5Btn = document.getElementById('timerDec5Btn');   // -5 sec
      const timerInc5Btn = document.getElementById('timerInc5Btn');   // +5 sec
      const timerIncBtn = document.getElementById('timerIncBtn');     // +1 min
      const timerDisplay = document.getElementById('timerDisplay');
      const timerStartPauseBtn = document.getElementById('timerStartPauseBtn');
      const timerStartPauseText = document.getElementById('timerStartPauseText');
      const timerResetBtn = document.getElementById('timerResetBtn');

      // Playback button
      const startStopBtn = document.getElementById('startStopBtn');
      const startStopIcon = document.getElementById('startStopIcon');
      const startStopText = document.getElementById('startStopText');

      // --- Helper: Classical Tempo Name ---
      function getTempoMarkingName(bpm) {
        if (bpm < 40) return 'Grave';
        if (bpm < 60) return 'Largo';
        if (bpm < 66) return 'Larghetto';
        if (bpm < 76) return 'Adagio';
        if (bpm < 108) return 'Andante';
        if (bpm < 120) return 'Moderato';
        if (bpm < 156) return 'Allegro';
        if (bpm < 176) return 'Vivace';
        if (bpm < 200) return 'Presto';
        return 'Prestissimo';
      }

      // --- UI Rendering Functions ---
      function updateBpmUI() {
        bpmDisplay.textContent = state.bpm;
        tempoMarking.textContent = getTempoMarkingName(state.bpm);

        bpmDec1Btn.disabled = state.bpm <= MIN_BPM;
        bpmDec5Btn.disabled = state.bpm <= MIN_BPM;
        bpmInc1Btn.disabled = state.bpm >= MAX_BPM;
        bpmInc5Btn.disabled = state.bpm >= MAX_BPM;
      }

      function updateTimeSignatureUI() {
        const bottomValue = NOTE_VALUES[state.beatUnitIndex];
        tsTopDisplay.textContent = state.beatsPerMeasure;
        tsBottomDisplay.textContent = bottomValue;
        timeSigLabel.textContent = `${state.beatsPerMeasure}/${bottomValue}`;
        headerMeterBadge.textContent = `${state.beatsPerMeasure}/${bottomValue}`;

        tsTopDecBtn.disabled = state.beatsPerMeasure <= MIN_TOP_TS;
        tsTopIncBtn.disabled = state.beatsPerMeasure >= MAX_TOP_TS;
        tsBottomDecBtn.disabled = state.beatUnitIndex <= 0;
        tsBottomIncBtn.disabled = state.beatUnitIndex >= NOTE_VALUES.length - 1;

        renderBeatLights();
      }

      function renderBeatLights() {
        beatLightsContainer.innerHTML = '';
        for (let i = 0; i < state.beatsPerMeasure; i++) {
          const isAccent = i === 0;
          const node = document.createElement('div');
          node.dataset.beatIndex = i;
          const sizeClasses = state.beatsPerMeasure > 10
            ? 'beat-s'
            : state.beatsPerMeasure > 6
              ? 'beat-m'
              : 'beat-l';

          node.className = `beat-node ${sizeClasses} rounded-full border flex items-center justify-center font-mono font-bold ${
            isAccent
              ? 'bg-slate-900 border-amber-500/50 text-amber-400'
              : 'bg-slate-900 border-slate-700 text-slate-400'
          }`;
          node.textContent = i + 1;
          beatLightsContainer.appendChild(node);
        }
      }

      const SPEAKER_PATH = '<path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5z" />';

      function updateVolumeUI() {
        const v = state.volume;
        volumeSlider.value = v;
        volumeSlider.style.setProperty('--pct', v + '%');
        volumeSlider.classList.toggle('range-muted', v === 0);

        if (v === 0) {
          volumeValue.textContent = 'Muted';
          volumeValue.className = 'lbl font-mono font-bold text-rose-400 tabular-nums';
          volumeIconWrapper.className = 'vol-icon rounded bg-slate-900 border border-rose-500/40 flex items-center justify-center text-rose-400 shrink-0';
          volumeSvg.innerHTML = SPEAKER_PATH + '<path stroke-linecap="round" stroke-linejoin="round" d="M23 9l-6 6m0-6l6 6" />';
        } else {
          volumeValue.textContent = v + '%';
          volumeValue.className = 'lbl font-mono font-bold text-emerald-400 tabular-nums';
          volumeIconWrapper.className = 'vol-icon rounded bg-slate-900 border border-slate-700 flex items-center justify-center text-emerald-400 shrink-0';
          volumeSvg.innerHTML = v <= 40
            ? SPEAKER_PATH + '<path stroke-linecap="round" stroke-linejoin="round" d="M15.54 8.46a5 5 0 010 7.07" />'
            : SPEAKER_PATH + '<path stroke-linecap="round" stroke-linejoin="round" d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14" />';
        }
      }

      function updateBrightnessUI() {
        const b = state.brightness;
        brightnessSlider.value = b;
        brightnessSlider.style.setProperty('--pct', b + '%');
        brightnessSlider.classList.toggle('range-muted', b === 0);
        metronomeConsole.style.setProperty('--flash', String(b / 100));

        if (b === 0) {
          brightnessValue.textContent = 'Off';
          brightnessValue.className = 'lbl font-mono font-bold text-slate-500 tabular-nums';
          brightnessIconWrapper.className = 'vol-icon rounded bg-slate-900 border border-slate-700 flex items-center justify-center text-slate-500 shrink-0';
        } else {
          brightnessValue.textContent = b + '%';
          brightnessValue.className = 'lbl font-mono font-bold text-amber-400 tabular-nums';
          brightnessIconWrapper.className = 'vol-icon rounded bg-slate-900 border border-amber-500/40 flex items-center justify-center text-amber-400 shrink-0';
        }
      }

      function updatePlaybackUI() {
        if (state.isPlaying) {
          startStopBtn.className = 'tactile-btn start-btn w-full px-4 rounded-xl bg-rose-500 hover:bg-rose-400 active:bg-rose-600 text-white font-extrabold tracking-wide uppercase shadow-md shadow-rose-500/20 flex items-center justify-center transition-all';
          startStopIcon.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" class="start-icon fill-current" viewBox="0 0 24 24">
              <path d="M6 6h12v12H6z"/>
            </svg>
          `;
          startStopText.textContent = 'Stop Metronome';
        } else {
          startStopBtn.className = 'tactile-btn start-btn w-full px-4 rounded-xl bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-slate-950 font-extrabold tracking-wide uppercase shadow-md shadow-emerald-500/20 flex items-center justify-center transition-all';
          startStopIcon.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" class="start-icon fill-current" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"/>
            </svg>
          `;
          startStopText.textContent = 'Start Metronome';
          headerPulseDot.className = 'pulse-dot rounded-full bg-slate-700 transition-all duration-75';
          clearBeatVisuals();
        }
      }

      // --- Practice Countdown Timer Functions ---
      function formatSecondsMMSS(totalSec) {
        const clamped = Math.max(0, Math.ceil(totalSec));
        const mins = Math.floor(clamped / 60);
        const secs = clamped % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      const TIMER_BTN_BASE = 'tactile-btn timer-main-btn flex-1 rounded-lg text-slate-950 font-extrabold uppercase tracking-wider shadow-sm flex items-center justify-center gap-1 transition-all ';
      const TIMER_BTN_CYAN = TIMER_BTN_BASE + 'bg-cyan-500 hover:bg-cyan-400 active:bg-cyan-600';
      const TIMER_BTN_AMBER = TIMER_BTN_BASE + 'bg-amber-500 hover:bg-amber-400 active:bg-amber-600';

      function updateTimerUI() {
        timerDisplay.textContent = formatSecondsMMSS(state.timerRemainingSec);

        const shown = state.timerRemainingSec;
        const atMin = shown <= MIN_TIMER_SEC;
        const atMax = shown >= MAX_TIMER_SEC;
        timerDecBtn.disabled = atMin;
        timerDec5Btn.disabled = atMin;
        timerIncBtn.disabled = atMax;
        timerInc5Btn.disabled = atMax;

        if (state.timerAlarmActive) {
          timerSection.classList.add('timer-alarm-active');
          timerStatusDot.className = 'pulse-dot rounded-full bg-amber-400 shadow-[0_0_8px_#f59e0b]';
          timerStateSubtext.textContent = 'TIME UP!';
          timerStateSubtext.className = 'lbl-xs font-mono text-amber-300 font-bold';
          timerStartPauseBtn.className = TIMER_BTN_AMBER;
          timerStartPauseText.textContent = 'Stop Alarm';
        } else if (state.timerRunning) {
          timerSection.classList.remove('timer-alarm-active');
          timerStatusDot.className = 'pulse-dot rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee] animate-pulse';
          timerStateSubtext.textContent = 'RUNNING';
          timerStateSubtext.className = 'lbl-xs font-mono text-cyan-400 font-semibold';
          timerStartPauseBtn.className = TIMER_BTN_AMBER;
          timerStartPauseText.textContent = 'Pause';
        } else {
          timerSection.classList.remove('timer-alarm-active');
          timerStatusDot.className = 'pulse-dot rounded-full bg-slate-700 transition-all';
          timerStateSubtext.textContent = state.timerPaused ? 'PAUSED' : 'READY';
          timerStateSubtext.className = 'lbl-xs font-mono text-slate-400 font-semibold';
          timerStartPauseBtn.className = TIMER_BTN_CYAN;
          timerStartPauseText.textContent = state.timerPaused ? 'Resume' : 'Start Timer';
        }
      }

      // Single short "time's up" beep: a pure, sustained high tone, clearly different
      // from the short percussive click. Its loudness follows the volume slider.
      function playTimerBeep() {
        ensureAudioContext();
        if (state.volume <= 0) return;
        const t = audioCtx.currentTime + 0.02;
        const length = 0.32;

        const osc = audioCtx.createOscillator();
        const overtone = audioCtx.createOscillator();
        const overtoneGain = audioCtx.createGain();
        const env = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(1975.5, t);        // B6
        overtone.type = 'sine';
        overtone.frequency.setValueAtTime(1975.5 * 2, t);
        overtoneGain.gain.setValueAtTime(0.18, t);

        env.gain.setValueAtTime(0.0001, t);
        env.gain.linearRampToValueAtTime(BEEP_DRIVE, t + 0.006);
        env.gain.setValueAtTime(BEEP_DRIVE, t + length - 0.04);
        env.gain.exponentialRampToValueAtTime(0.0001, t + length);

        osc.connect(env);
        overtone.connect(overtoneGain);
        overtoneGain.connect(env);
        env.connect(masterGainNode);

        osc.start(t);
        overtone.start(t);
        osc.stop(t + length + 0.02);
        overtone.stop(t + length + 0.02);
      }

      function stopTimerAlarm() {
        state.timerAlarmActive = false;
        if (state.alarmTimeoutID) {
          clearTimeout(state.alarmTimeoutID);
          state.alarmTimeoutID = null;
        }
      }

      function stopTimerInterval() {
        if (state.timerIntervalID) {
          clearInterval(state.timerIntervalID);
          state.timerIntervalID = null;
        }
      }

      function triggerTimerCompleteAlarm() {
        state.timerRunning = false;
        state.timerPaused = false;
        stopTimerInterval();
        state.timerRemainingSec = 0;
        state.timerAlarmActive = true;
        updateTimerUI();

        playTimerBeep();

        // Keep the visual alarm going for a few seconds (useful when muted), then reset.
        state.alarmTimeoutID = setTimeout(() => {
          stopTimerAlarm();
          state.timerRemainingSec = state.timerPresetSec;
          updateTimerUI();
        }, ALARM_VISUAL_MS);
      }

      function tickTimer() {
        if (!state.timerRunning) return;
        const remainingMs = state.timerEndTimeMs - Date.now();
        if (remainingMs <= 0) {
          triggerTimerCompleteAlarm();
        } else {
          state.timerRemainingSec = Math.ceil(remainingMs / 1000);
          updateTimerUI();
        }
      }

      function toggleTimerStartPause() {
        ensureAudioContext();

        // If the alarm is showing, the button silences & resets it
        if (state.timerAlarmActive) {
          resetTimer();
          return;
        }

        if (state.timerRunning) {
          // Pause
          state.timerRunning = false;
          state.timerPaused = true;
          stopTimerInterval();
          const remainingMs = Math.max(0, state.timerEndTimeMs - Date.now());
          state.timerRemainingSec = Math.ceil(remainingMs / 1000);
        } else {
          // Start or resume
          if (state.timerRemainingSec <= 0) {
            state.timerRemainingSec = state.timerPresetSec;
          }
          state.timerRunning = true;
          state.timerPaused = false;
          state.timerEndTimeMs = Date.now() + state.timerRemainingSec * 1000;
          state.timerIntervalID = setInterval(tickTimer, 200);
        }

        updateTimerUI();
      }

      function resetTimer() {
        stopTimerAlarm();
        stopTimerInterval();
        state.timerRunning = false;
        state.timerPaused = false;
        state.timerRemainingSec = state.timerPresetSec;
        updateTimerUI();
      }

      // Adjust the time shown by deltaSec (±60 for the outer arrows, ±5 for the inner ones).
      // When the timer is idle this sets the preset (what Reset returns to);
      // while running or paused it adjusts the remaining time.
      function changeTimer(deltaSec) {
        if (state.timerAlarmActive) {
          stopTimerAlarm();
          state.timerRemainingSec = state.timerPresetSec;
        }

        const current = state.timerRunning
          ? Math.max(0, Math.ceil((state.timerEndTimeMs - Date.now()) / 1000))
          : state.timerRemainingSec;
        const floor = Math.min(MIN_TIMER_SEC, current);
        const next = Math.min(MAX_TIMER_SEC, Math.max(floor, current + deltaSec));

        state.timerRemainingSec = next;
        if (state.timerRunning) {
          state.timerEndTimeMs = Date.now() + next * 1000;
        } else if (!state.timerPaused) {
          state.timerPresetSec = next;
          saveSettings();
        }
        updateTimerUI();
      }

      // --- Web Audio API Sound Synthesis & Lookahead Scheduler ---
      let masterGainNode = null;   // input of the output chain (all sounds connect here)
      let compressorNode = null;
      let volumeGainNode = null;   // user volume, applied last

      // Slider position (0–100) -> output gain. Squared taper sounds even across the range.
      function volumeToGain(v) {
        const x = Math.max(0, Math.min(100, v)) / 100;
        return x * x;
      }

      function ensureAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();
          const now = audioCtx.currentTime;

          // Output chain: boost -> compressor -> soft clipper -> volume -> speakers
          masterGainNode = audioCtx.createGain();
          masterGainNode.gain.setValueAtTime(2.0, now);

          compressorNode = audioCtx.createDynamicsCompressor();
          compressorNode.threshold.setValueAtTime(-3.0, now);
          compressorNode.knee.setValueAtTime(6.0, now);
          compressorNode.ratio.setValueAtTime(12.0, now);
          compressorNode.attack.setValueAtTime(0.001, now);
          compressorNode.release.setValueAtTime(0.05, now);

          // Soft clipper: catches the peaks the compressor lets through, so nothing hard-clips
          const clipperInput = audioCtx.createGain();
          clipperInput.gain.setValueAtTime(0.5, now);
          const softClipper = audioCtx.createWaveShaper();
          const curve = new Float32Array(2048);
          for (let i = 0; i < curve.length; i++) {
            const x = (i / (curve.length - 1)) * 2 - 1;
            curve[i] = Math.tanh(2 * x);
          }
          softClipper.curve = curve;
          softClipper.oversample = '4x';

          volumeGainNode = audioCtx.createGain();
          volumeGainNode.gain.setValueAtTime(volumeToGain(state.volume), now);

          masterGainNode.connect(compressorNode);
          compressorNode.connect(clipperInput);
          clipperInput.connect(softClipper);
          softClipper.connect(volumeGainNode);
          volumeGainNode.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function applyVolumeToAudio() {
        if (!audioCtx || !volumeGainNode) return;
        volumeGainNode.gain.setTargetAtTime(volumeToGain(state.volume), audioCtx.currentTime, 0.015);
      }

      function scheduleClickSound(beatIndex, time) {
        if (state.volume <= 0) return;

        const peakGain = CLICK_DRIVE;
        const isAccent = beatIndex === 0;
        const osc = audioCtx.createOscillator();
        const transientOsc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        const transientGain = audioCtx.createGain();

        // Main body click oscillator
        osc.type = 'triangle';
        const baseFreq = isAccent ? 1320 : 880;
        osc.frequency.setValueAtTime(baseFreq, time);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.45, time + 0.035);

        // Crisp attack transient oscillator to cut through on mobile speakers
        transientOsc.type = 'square';
        transientOsc.frequency.setValueAtTime(isAccent ? 2640 : 1760, time);
        transientOsc.frequency.exponentialRampToValueAtTime(440, time + 0.012);

        transientGain.gain.setValueAtTime(peakGain * 0.6, time);
        transientGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.012);

        gainNode.gain.setValueAtTime(0.0001, time);
        gainNode.gain.linearRampToValueAtTime(peakGain, time + 0.0015);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, time + CLICK_DECAY_SEC);

        osc.connect(gainNode);
        transientOsc.connect(transientGain);
        transientGain.connect(gainNode);

        gainNode.connect(masterGainNode);

        osc.start(time);
        osc.stop(time + CLICK_DECAY_SEC + 0.005);
        transientOsc.start(time);
        transientOsc.stop(time + 0.015);
      }

      function advanceNote() {
        const bottomValue = NOTE_VALUES[state.beatUnitIndex];
        const secondsPerBeat = (60.0 / state.bpm) * (4 / bottomValue);
        state.nextNoteTime += secondsPerBeat;
        state.currentBeat = (state.currentBeat + 1) % state.beatsPerMeasure;
      }

      function scheduleNote(beatIndex, time) {
        scheduleClickSound(beatIndex, time);
        state.visualQueue.push({ beat: beatIndex, time: time });
      }

      function scheduler() {
        while (state.nextNoteTime < audioCtx.currentTime + SCHEDULE_AHEAD_SEC) {
          scheduleNote(state.currentBeat, state.nextNoteTime);
          advanceNote();
        }
      }

      function clearBeatVisuals() {
        const nodes = beatLightsContainer.children;
        for (let i = 0; i < nodes.length; i++) {
          nodes[i].classList.remove('beat-accent-active', 'beat-regular-active');
        }
        metronomeConsole.classList.remove('panel-flash-accent', 'panel-flash-regular');
      }

      // Flash the console background behind the panels (amber on beat 1, green on the others).
      // Strength follows the brightness slider; 0 = no flash at all.
      function flashConsole(isAccent) {
        const strength = state.brightness / 100;
        if (strength <= 0) return;
        const bottomValue = NOTE_VALUES[state.beatUnitIndex];
        const beatMs = (60000 / state.bpm) * (4 / bottomValue);
        beatFlash.style.backgroundColor = isAccent ? '#f59e0b' : '#10b981';
        beatFlash.getAnimations().forEach((a) => a.cancel());
        beatFlash.animate(
          [{ opacity: strength * FLASH_MAX_OPACITY }, { opacity: 0 }],
          { duration: Math.max(70, Math.min(260, beatMs * 0.6)), easing: 'cubic-bezier(0.2, 0.6, 0.35, 1)' }
        );
      }

      function triggerBeatVisual(beatIndex) {
        clearBeatVisuals();

        const nodes = beatLightsContainer.children;
        const targetNode = nodes[beatIndex];
        const isAccent = beatIndex === 0;

        if (targetNode) {
          targetNode.classList.add(isAccent ? 'beat-accent-active' : 'beat-regular-active');
        }

        flashConsole(isAccent);
        if (state.brightness > 0) {
          metronomeConsole.classList.add(isAccent ? 'panel-flash-accent' : 'panel-flash-regular');
        }
        headerPulseDot.className = isAccent
          ? 'pulse-dot rounded-full bg-amber-400 shadow-[0_0_8px_#f59e0b] scale-125 transition-all duration-75'
          : 'pulse-dot rounded-full bg-emerald-400 shadow-[0_0_8px_#10b981] scale-110 transition-all duration-75';

        setTimeout(() => {
          if (targetNode) {
            targetNode.classList.remove('beat-accent-active', 'beat-regular-active');
          }
          metronomeConsole.classList.remove('panel-flash-accent', 'panel-flash-regular');
          if (state.isPlaying) {
            headerPulseDot.className = 'pulse-dot rounded-full bg-slate-700 transition-all duration-150';
          }
        }, 105);
      }

      function visualLoop() {
        if (!state.isPlaying) return;

        const currentTime = audioCtx.currentTime;
        while (state.visualQueue.length && state.visualQueue[0].time <= currentTime + 0.015) {
          const event = state.visualQueue.shift();
          triggerBeatVisual(event.beat);
        }

        requestAnimationFrame(visualLoop);
      }

      function toggleStartStop() {
        ensureAudioContext();
        state.isPlaying = !state.isPlaying;

        if (state.isPlaying) {
          state.currentBeat = 0;
          state.visualQueue = [];
          state.nextNoteTime = audioCtx.currentTime + 0.04;
          state.timerID = setInterval(scheduler, LOOKAHEAD_MS);
          requestAnimationFrame(visualLoop);
        } else {
          if (state.timerID) {
            clearInterval(state.timerID);
            state.timerID = null;
          }
          state.visualQueue = [];
        }

        updatePlaybackUI();
        updateWakeLock();
      }

      // --- State Mutation Handlers ---
      function setBpm(bpm) {
        const nextBpm = Math.min(MAX_BPM, Math.max(MIN_BPM, Math.round(bpm)));
        if (nextBpm !== state.bpm) {
          state.bpm = nextBpm;
          updateBpmUI();
          saveSettings();
        }
      }

      function changeBpm(delta) {
        setBpm(state.bpm + delta);
      }

      function changeTopTimeSignature(delta) {
        const nextTop = Math.min(MAX_TOP_TS, Math.max(MIN_TOP_TS, state.beatsPerMeasure + delta));
        if (nextTop !== state.beatsPerMeasure) {
          state.beatsPerMeasure = nextTop;
          if (state.currentBeat >= state.beatsPerMeasure) {
            state.currentBeat = 0;
          }
          updateTimeSignatureUI();
          saveSettings();
        }
      }

      function changeBottomTimeSignature(delta) {
        const nextIndex = Math.min(NOTE_VALUES.length - 1, Math.max(0, state.beatUnitIndex + delta));
        if (nextIndex !== state.beatUnitIndex) {
          state.beatUnitIndex = nextIndex;
          updateTimeSignatureUI();
          saveSettings();
        }
      }

      // --- Saved settings (restored the next time the app opens) ---
      const SETTINGS_KEY = 'studioMetronome.settings.v1';
      let saveTimeoutID = null;

      function loadSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
          if (!saved || typeof saved !== 'object') return;
          const pick = (v, min, max, fallback) =>
            (typeof v === 'number' && isFinite(v)) ? Math.min(max, Math.max(min, Math.round(v))) : fallback;
          state.bpm = pick(saved.bpm, MIN_BPM, MAX_BPM, state.bpm);
          state.beatsPerMeasure = pick(saved.beatsPerMeasure, MIN_TOP_TS, MAX_TOP_TS, state.beatsPerMeasure);
          state.beatUnitIndex = pick(saved.beatUnitIndex, 0, NOTE_VALUES.length - 1, state.beatUnitIndex);
          state.volume = pick(saved.volume, 0, 100, state.volume);
          state.brightness = pick(saved.brightness, 0, 100, state.brightness);
          state.timerPresetSec = pick(saved.timerPresetSec, MIN_TIMER_SEC, MAX_TIMER_SEC, state.timerPresetSec);
          state.timerRemainingSec = state.timerPresetSec;
        } catch (e) { /* storage unavailable or corrupt: use defaults */ }
      }

      function writeSettingsNow() {
        clearTimeout(saveTimeoutID);
        saveTimeoutID = null;
        try {
          localStorage.setItem(SETTINGS_KEY, JSON.stringify({
            bpm: state.bpm,
            beatsPerMeasure: state.beatsPerMeasure,
            beatUnitIndex: state.beatUnitIndex,
            volume: state.volume,
            brightness: state.brightness,
            timerPresetSec: state.timerPresetSec
          }));
        } catch (e) { /* storage unavailable: settings just won't persist */ }
      }

      // Debounced, so dragging a slider doesn't write on every pixel
      function saveSettings() {
        clearTimeout(saveTimeoutID);
        saveTimeoutID = setTimeout(writeSettingsNow, 300);
      }

      // --- Keep the screen awake while the metronome is playing ---
      let wakeLock = null;
      let wakeLockBusy = false;

      async function updateWakeLock() {
        if (!('wakeLock' in navigator) || wakeLockBusy) return;
        const wanted = state.isPlaying && document.visibilityState === 'visible';
        wakeLockBusy = true;
        let failed = false;
        try {
          if (wanted && !wakeLock) {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => { wakeLock = null; });
          } else if (!wanted && wakeLock) {
            const lock = wakeLock;
            wakeLock = null;
            await lock.release();
          }
        } catch (e) {
          wakeLock = null; // e.g. battery saver refused it; the metronome still works
          failed = true;
        } finally {
          wakeLockBusy = false;
        }
        // Playback may have been toggled while we were waiting; catch up once (no retry after a refusal)
        const stillWanted = state.isPlaying && document.visibilityState === 'visible';
        if (!failed && stillWanted !== !!wakeLock) updateWakeLock();
      }

      document.addEventListener('visibilitychange', () => {
        // The browser drops the lock when the app is hidden; take it again on return
        updateWakeLock();
        if (document.visibilityState === 'hidden' && saveTimeoutID) writeSettingsNow();
      });
      window.addEventListener('pagehide', () => { if (saveTimeoutID) writeSettingsNow(); });

      // --- Tap tempo ---
      // Tap the BPM display (or press T) along with the music; the tempo follows the average
      // of the last few taps. A pause of more than 2 seconds starts a fresh count.
      const TAP_RESET_MS = 2000;
      const TAP_MAX_INTERVALS = 5;
      let tapTimes = [];
      let tapCaptionTimeoutID = null;
      let tapHitTimeoutID = null;

      function setTapCaption(text, holdMs) {
        bpmCaption.textContent = text;
        clearTimeout(tapCaptionTimeoutID);
        tapCaptionTimeoutID = setTimeout(() => { bpmCaption.textContent = 'Tap for tempo'; }, holdMs);
      }

      function tapTempo() {
        const now = performance.now();
        if (tapTimes.length && now - tapTimes[tapTimes.length - 1] > TAP_RESET_MS) {
          tapTimes = [];
        }
        // A tap far off the rhythm so far (a double-tap, or a new tempo) starts a fresh count from it
        if (tapTimes.length >= 2) {
          const avgSoFar = (tapTimes[tapTimes.length - 1] - tapTimes[0]) / (tapTimes.length - 1);
          const interval = now - tapTimes[tapTimes.length - 1];
          if (Math.abs(interval - avgSoFar) > avgSoFar * 0.4) {
            tapTimes = interval < avgSoFar * 0.4 ? [] : [tapTimes[tapTimes.length - 1]];
          }
        }
        tapTimes.push(now);
        if (tapTimes.length > TAP_MAX_INTERVALS + 1) tapTimes.shift();

        bpmTapBtn.classList.add('tap-hit');
        clearTimeout(tapHitTimeoutID);
        tapHitTimeoutID = setTimeout(() => bpmTapBtn.classList.remove('tap-hit'), 90);

        if (tapTimes.length < 2) {
          setTapCaption('Keep tapping…', TAP_RESET_MS);
          return;
        }
        const avgIntervalMs = (tapTimes[tapTimes.length - 1] - tapTimes[0]) / (tapTimes.length - 1);
        // Taps are beats as the metronome plays them, so account for the beat unit (x/8 = eighth notes)
        const bottomValue = NOTE_VALUES[state.beatUnitIndex];
        setBpm((60000 * 4) / (avgIntervalMs * bottomValue));
        setTapCaption('Tapped tempo', TAP_RESET_MS);
      }

      function setVolume(newVolume) {
        state.volume = Math.min(100, Math.max(0, Math.round(newVolume)));
        updateVolumeUI();
        applyVolumeToAudio();
        saveSettings();
      }

      function setBrightness(newBrightness) {
        state.brightness = Math.min(100, Math.max(0, Math.round(newBrightness)));
        updateBrightnessUI();
        saveSettings();
      }

      // --- Event Listeners ---
      bpmDec5Btn.addEventListener('click', () => changeBpm(-5));
      bpmDec1Btn.addEventListener('click', () => changeBpm(-1));
      bpmInc1Btn.addEventListener('click', () => changeBpm(1));
      bpmInc5Btn.addEventListener('click', () => changeBpm(5));
      bpmTapBtn.addEventListener('pointerdown', (e) => {
        if (e.button === 0) tapTempo();
      });
      bpmTapBtn.addEventListener('click', (e) => {
        if (e.detail === 0) tapTempo(); // keyboard activation (Enter)
      });

      tsTopDecBtn.addEventListener('click', () => changeTopTimeSignature(-1));
      tsTopIncBtn.addEventListener('click', () => changeTopTimeSignature(1));
      tsBottomDecBtn.addEventListener('click', () => changeBottomTimeSignature(-1));
      tsBottomIncBtn.addEventListener('click', () => changeBottomTimeSignature(1));

      volumeSlider.addEventListener('input', () => setVolume(Number(volumeSlider.value)));
      brightnessSlider.addEventListener('input', () => setBrightness(Number(brightnessSlider.value)));

      // Practice Timer Event Listeners
      timerDecBtn.addEventListener('click', () => changeTimer(-60));
      timerDec5Btn.addEventListener('click', () => changeTimer(-5));
      timerInc5Btn.addEventListener('click', () => changeTimer(5));
      timerIncBtn.addEventListener('click', () => changeTimer(60));
      timerStartPauseBtn.addEventListener('click', toggleTimerStartPause);
      timerResetBtn.addEventListener('click', resetTimer);

      startStopBtn.addEventListener('click', toggleStartStop);

      window.addEventListener('keydown', (e) => {
        const onSlider = e.target && e.target.type === 'range';
        if (e.code === 'Space') {
          e.preventDefault();
          toggleStartStop();
        } else if (e.code === 'KeyT' && !e.repeat && !e.ctrlKey && !e.metaKey && !e.altKey) {
          tapTempo();
        } else if (onSlider) {
          return; // let arrow keys move the focused slider
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          changeBpm(-1);
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          changeBpm(1);
        } else if (e.code === 'ArrowUp') {
          e.preventDefault();
          changeBpm(5);
        } else if (e.code === 'ArrowDown') {
          e.preventDefault();
          changeBpm(-5);
        }
      });

      // Initialize UI on load (with the settings saved last time, if any)
      loadSettings();
      updateBpmUI();
      updateTimeSignatureUI();
      updateVolumeUI();
      updateBrightnessUI();
      updateTimerUI();
      updatePlaybackUI();

      // --- Progressive Web App (PWA) Service Worker & Install Prompt ---
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }

      let deferredPrompt = null;
      const installBtn = document.getElementById('install-btn');

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) {
          installBtn.style.display = 'inline-block';
        }
      });

      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            installBtn.style.display = 'none';
          }
          deferredPrompt = null;
        });
      }

      window.addEventListener('appinstalled', () => {
        if (installBtn) {
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      });
    })();
  </script>
</body>
</html>
